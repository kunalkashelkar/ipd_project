# ============================================================
# Docker Compose Setup
# ============================================================

version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: xai_vuln_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: xai_vuln_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d xai_vuln_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: xai_vuln_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./uploads:/app/uploads
      - .env:/app/.env
    env_file:
      - .env
    # We use reload inside, so changes to volume trigger reload

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: xai_vuln_frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
