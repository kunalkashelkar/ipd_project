# ============================================================
# Hybrid XAI Vulnerability Detection — pyproject.toml
# ============================================================
# Central Python project configuration.
# Manages metadata, dependencies, build system, and tool configs.
# ============================================================

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-xai-vuln-detection"
version = "0.1.0"
description = "Hybrid Explainable AI framework for software vulnerability detection combining program analysis (CPG, taint analysis) with Graph Neural Networks and XAI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Kunal" },
]
keywords = [
    "vulnerability-detection",
    "explainable-ai",
    "graph-neural-network",
    "code-property-graph",
    "taint-analysis",
    "static-analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core runtime dependencies
dependencies = [
    # ── Web Framework ──
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # ── Database ──
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # ── ML / Deep Learning ──
    "torch>=2.3.0",
    "torch-geometric>=2.5.0",
    "transformers>=4.41.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",

    # ── Explainability ──
    "captum>=0.7.0",
    "shap>=0.45.0",

    # ── Graph / Parsing ──
    "networkx>=3.3",
    "pydot>=2.0.0",

    # ── Utilities ──
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "ipython>=8.25.0",
]
notebooks = [
    "jupyter>=1.0.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "plotly>=5.22.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

[project.urls]
Repository = "https://github.com/kunal/hybrid-xai-vuln-detection"
Documentation = "https://github.com/kunal/hybrid-xai-vuln-detection/tree/main/docs"

# ── Tool Configurations ──

[tool.setuptools.packages.find]
include = [
    "backend*",
    "parser*",
    "taint_analysis*",
    "feature_engineering*",
    "models*",
    "explainability*",
    "visualization*",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["backend", "parser", "taint_analysis", "feature_engineering", "models", "explainability", "visualization"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
    "backend",
    "parser",
    "taint_analysis",
    "feature_engineering",
    "models",
    "explainability",
    "visualization",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring external services",
    "gpu: marks tests that require GPU",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
